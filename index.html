<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class="bg-1">
    <div class="container min-vh-100 md:d-flex md:flex-column md:justify-content-center">
        <div class="row">
            <aside class="d-none xl:d-flex align-items-center col" id="menu">
                <nav class="nav flex-column gap-1">
                    <div class="text-uppercase text-muted small fw-bold mb-1">
                        Distribuciones
                    </div>

                    <a href="#binomial" class="text-decoration-none theme-secondary underline-offset-2 underline-20 hover:underline-100" id="tab-binomial">
                        <p>Binomial</p>
                    </a>
                    <a href="#hipergeometrica" class="text-decoration-none theme-secondary underline-offset-2 underline-20 hover:underline-100" id="tab-hipergeometrica">
                        <p>Hipergeométrica</p>
                    </a>
                    <a href="#normal" class="text-decoration-none theme-secondary underline-offset-2 underline-20 hover:underline-100" id="tab-normal">
                        <p>Normal</p>
                    </a>
                </nav>
            </aside>
            <main class="xl:col-10">
                <nav class="navbar bg-1 fg-2 lg:d-block xl:d-none">
                    <div class="container-fluid">
                        <p class="navbar-brand m-0" href="#">Mas opciones -></p>
                        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="dialog"
                            data-bs-target="#mobileDialog">
                            <span class="navbar-toggler-icon" aria-hidden="true"></span>
                        </button>
                        <dialog class="dialog" id="mobileDialog">
                            <div class="dialog-header">
                                <h1 class="dialog-title">Seleccione una opcion</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="dialog"
                                    aria-label="Close"></button>
                            </div>
                            <div class="dialog-body" id="menu-movil">
                                <nav class="nav flex-column gap-1">
                                    <a href="#binomial"
                                        class="text-decoration-none theme-inverse underline-offset-2 underline-20 hover:underline-100"
                                        id="tab-binomial-mobile" data-bs-dismiss="dialog">
                                        <p class="">Binomial</p>
                                    </a>
                                    <a href="#hipergeometrica"
                                        class="text-decoration-none theme-inverse underline-offset-2 underline-20 hover:underline-100"
                                        id="tab-hipergeometrica-mobile" data-bs-dismiss="dialog">
                                        <p>Hipergeométrica</p>
                                    </a>
                                    <a href="#normal"
                                        class="text-decoration-none theme-inverse underline-offset-2 underline-20 hover:underline-100"
                                        id="tab-normal-mobile" data-bs-dismiss="dialog">
                                        <p>Normal</p>
                                    </a>
                                </nav>
                            </div>
                        </dialog>
                    </div>
                </nav>
                <h1 class="text-center text-capitalize md:text-start" id="titulo">Binomial</h1>
                <p class="my-4">Ingrese los datos necesarios</p>
                <!--Formulario-->
                <form action="">
                    <div class="d-flex flex-column align-items-center gap-5">
                        <!--Formulario Binomial-->
                        <div id="inputs-binomial" class="dist-form row gap-5 justify-content-center">

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="bin-n" class="col-form-label col">Numero de ensayos (n)</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="bin-n">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="bin-p" class="col-form-label col">Probabilidad de exito
                                    (p)</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="bin-p">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="bin-x" class="col-form-label col">Exitos buscados (x):</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="bin-x">
                                </div>
                            </div>

                            <div class="col-12 lg:col-4 row justify-content-center">
                                <label for="bin-cond" class="col-form-label col-auto">Condición:</label>
                                <div class="col-auto">
                                    <select class="form-control" id="bin-cond">
                                        <option value="" selected disabled>Elige uno</option>
                                        <option value="=">P(X = x)</option>
                                        <option value="<=">P(X ≤ x)</option>
                                        <option value="<">P(X < x)</option>
                                        <option value=">=">P(X ≥ x)</option>
                                        <option value=">">P(X > x)</option>
                                    </select>
                                </div>
                            </div>

                        </div>

                        <!--Formulario Hipergeometrica-->
                        <div id="inputs-hipergeometrica" class="dist-form row gap-5 justify-content-center d-none">

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="hip-N" class="col-form-label col">Poblacion Total (N):</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="hip-N">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="hip-K" class="col-form-label col">Exitos en la poblacion
                                    (K):</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="hip-K">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="hip-n" class="col-form-label col">Tamaño de la muestra
                                    (n):</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="hip-n">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="hip-x" class="col-form-label col">Exitos en la muestra
                                    (x):</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="hip-x">
                                </div>
                            </div>

                            <div class="col-12 lg:col-4 row justify-content-center">
                                <label for="hip-cond" class="col-form-label col-auto">Condición:</label>
                                <div class="col-auto">
                                    <select class="form-control" id="hip-cond">
                                        <option value="" selected disabled>Elige uno</option>
                                        <option value="=">P(X = x)</option>
                                        <option value="<=">P(X ≤ x)</option>
                                        <option value="<">P(X < x)</option>
                                        <option value=">=">P(X ≥ x)</option>
                                        <option value=">">P(X > x)</option>
                                    </select>
                                </div>
                            </div>

                        </div>

                        <!--Formulario Normal-->
                        <div id="inputs-normal" class="dist-form row gap-5 justify-content-center d-none">

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="norm-mu" class="col-form-label col">Media (μ)</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="norm-mu">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="norm-sigma" class="col-form-label col">Desviación estándar (σ)</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="norm-sigma">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="norm-x" class="col-form-label col">Valor de límite (x)</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="norm-x">
                                </div>
                            </div>

                            <div class="col-auto lg:col-3 row lg:row-cols-1 align-items-center">
                                <label for="norm-n" class="col-form-label col">Tamaño de la muestra (n)</label>
                                <div class="col">
                                    <input type="number" class="form-control" id="norm-n">
                                </div>
                            </div>

                            <div class="col-12 lg:col-4 row justify-content-center">
                                <label for="norm-cond" class="col-form-label col-auto">Condición</label>
                                <div class="col-auto">
                                    <select class="form-control" id="norm-cond">
                                        <option value="" selected disabled>Elige uno</option>
                                        <option value="<=">P(X ≤ x)</option>
                                        <option value=">=">P(X ≥ x)</option>
                                    </select>
                                </div>
                            </div>

                        </div>

                        <button type="button" class="btn-solid theme-secondary" id="btnCalcular">
                            Calcular
                        </button>
                    </div>
                </form>
                <!--Tarjeta de resultados-->
                <div>
                    <h3 class="fs-lg fw-bold my-5">Resultado:</h3>
                    <div
                        class="container d-flex flex-column align-items-center bg-3 border border-2 border-emphasized rounded py-3">
                        <p class="align-self-start fs-lg fw-bold mb-0">Probabilidad: </p>
                        <span class="fs-3xl fw-bold" id="r-1">0.0000</span>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script type="module" src="./dom.js"></script>
</body>

</html>
