<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class="bg-1">
    <div class="container min-vh-100 md:d-flex md:flex-column md:justify-content-center">
        <div class="row">
            <aside class="d-none xl:d-flex align-items-center col">
                <div class="flex-column">
                    <nav class="nav flex-column gap-1">
                        <div class="text-uppercase text-muted small fw-bold mb-1">
                            Distribuciones
                        </div>

                        <a href="#binomial" class="text-decoration-none" id="tab-binomial">
                            <p class="">Binomial</p>
                        </a>
                        <a href="#hipergeometrica" class="text-decoration-none" id="tab-hipergeometrica">
                            <p>Hipergeométrica</p>
                        </a>
                        <a href="#normal" class="text-decoration-none" id="tab-normal">
                            <p>Normal</p>
                        </a>
                    </nav>
                </div>
            </aside>
            <main class="xl:col-10">

                <nav class="navbar bg-1 fg-2 lg:d-block xl:d-none">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">Navbar</a>
                        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                            data-bs-target="#navbarNavMenu" aria-controls="navbarNavMenu" aria-expanded="false"
                            aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon" aria-hidden="true"></span>
                        </button>
                        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavMenu"
                            aria-labelledby="navbarNavMenuLabel">
                            <div class="drawer-header">
                                <h5 class="drawer-title" id="navbarNavMenuLabel">Distribuciones</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="drawer"
                                    aria-label="Close"></button>
                            </div>
                            <div class="drawer-body">
                                <ul class="navbar-nav">
                                    <li class="nav-item">
                                        <a class="nav-link active" aria-current="page" href="#">Binomial</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">Hipergeométrica</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">Normal</a>
                                    </li>
                                </ul>
                            </div>
                        </dialog>
                    </div>
                </nav>
                <h1 class="text-center md:text-start">Binomial</h1>
                <p>Ingrese los datos necesarios</p>
                <form action="">
                    <!--Grid del formulario-->
                    <div class="row g-5 justify-content-center">
                        <!--N-->
                        <div class="col-auto lg:col-3">
                            <div class="row">
                                <label for="n_ensayos" class="form-label col-auto">n:</label>
                                <div class="col-auto">
                                    <input type="number" class="form-control" id="n_ensayos">
                                </div>
                            </div>
                        </div>
                        <!--p-->
                        <div class="col-auto lg:col-3">
                            <div class="row">
                                <label for="p_exito" class="form-label col-auto">p:</label>
                                <div class="col-auto">
                                    <input type="number" class="form-control" id="p_exito">
                                </div>
                            </div>
                        </div>
                        <!--x-->
                        <div class="col-auto lg:col-3">
                            <div class="row">
                                <label for="n_exito" class="form-label col-auto">x:</label>
                                <div class="col-auto">
                                    <input type="number" class="form-control" id="n_exito">
                                </div>
                            </div>
                        </div>
                        <!--combobox-->
                        <div class="col-auto lg:col-4">
                            <div class="row">
                                <label for="condicionBinomial" class="form-label col-auto">Probabilidad:</label>
                                <div class="col-auto">
                                    <select class="form-control" id="condicionBinomial">
                                        <option selected>Elige uno</option>
                                        <option value="igual">P(X = x)</option>
                                        <option value="menor_igual">P(X ≤ x)</option>
                                        <option value="menor">P(X < x)</option>
                                        <option value="mayor_igual">P(X ≥ x)</option>
                                        <option value="mayor">P(X < x)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button type="button" class="theme-primary btn-solid btn-styled" id="btnCalcular">
                                Calcular
                            </button>
                        </div>
                    </div>
                </form>
                <div>
                    <h3 id="resultado">Resultado:</h3>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script type="module" src="./dom.js"></script>
</body>

</html>
